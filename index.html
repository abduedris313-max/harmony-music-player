<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Harmony — Music Player</title>
    
    <!-- PWA Manifest & Icons -->
    <link rel="manifest" href="/harmony-music-player/manifest.json" />
    <link rel="icon" type="image/svg+xml" href="/harmony-music-player/icon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/harmony-music-player/icon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/harmony-music-player/icon-512.png" />
    <link rel="apple-touch-icon" href="/harmony-music-player/apple-touch-icon.png" />
    
    <!-- PWA Early Install Prompt Capture Script -->
    <script>
      window.__deferredInstallPrompt = null;
      window.addEventListener('beforeinstallprompt', function(e) {
        e.preventDefault();
        window.__deferredInstallPrompt = e;
        if (typeof window.__onBeforeInstallPrompt === 'function') {
          window.__onBeforeInstallPrompt(e);
        }
      });
    </script>

    <!-- Theme & Mobile Optimizations -->
    <meta name="theme-color" content="#f43f5e" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Harmony" />
    <meta name="application-name" content="Harmony" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
